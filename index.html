<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VF-CB | Vintage Figures Chat Bot</title>

  <style>
    :root {
      --bg: #08090d;
      --panel: #11131b;
      --panel2: #191c27;
      --line: rgba(255,255,255,0.10);
      --text: #f2f2f6;
      --muted: #8d91a3;
      --accent: #f1c232;
      --accentText: #111;
      --bot: #191c27;
      --user: #2a2615;
      --userLine: rgba(241,194,50,0.45);
      --radius: 14px;
      --safeBottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      height: 100dvh;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 0%, rgba(241,194,50,0.08), transparent 32%),
        linear-gradient(180deg, #101119 0%, #08090d 55%);
    }

    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 11, 16, 0.94);
      backdrop-filter: blur(12px);
    }

    .droid-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accentText);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex: 0 0 auto;
    }

    .title-wrap {
      min-width: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.25;
    }

    .chat {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      width: fit-content;
      max-width: min(760px, 88vw);
      padding: 13px 15px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
      align-self: flex-start;
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0,0,0,0.20);
    }

    .message.bot {
      background: var(--bot);
      border-top-left-radius: 5px;
    }

    .message.user {
      background: var(--user);
      border-color: var(--userLine);
      color: var(--text);
      border-top-left-radius: 5px;
    }

    .message a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .message a:hover {
      text-decoration: underline;
    }

    .image-card {
      width: fit-content;
      max-width: min(760px, 88vw);
      align-self: flex-start;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 8px 22px rgba(0,0,0,0.20);
    }

    .image-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .image-card img {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border-radius: 11px;
      background: #050609;
    }

    .image-caption {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .status {
      flex: 0 0 auto;
      min-height: 20px;
      padding: 0 16px 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .input-wrap {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      padding: 8px 12px 10px;
      background: transparent;
    }

    .input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid var(--line);
      outline: none;
      border-radius: 12px;
      padding: 12px 13px;
      background: var(--panel2);
      color: var(--text);
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.35;
    }

    .input:focus {
      border-color: rgba(241,194,50,0.65);
    }

    .send {
      flex: 0 0 auto;
      width: 72px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accentText);
      font-weight: 800;
      cursor: pointer;
    }

    .send:active {
      transform: scale(0.98);
    }

    .lookup {
      flex: 0 0 auto;
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 11, 16, 0.94);
    }

    .lookup label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .lookup input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--panel2);
      color: var(--text);
      font-size: 16px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .lookup input:focus {
      outline: 2px solid rgba(241,194,50,0.65);
      outline-offset: 1px;
    }

    .search-results {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 40vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .search-results[hidden] {
      display: none;
    }

    .search-result {
      width: 100%;
      min-height: 44px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .search-results li:last-child .search-result {
      border-bottom: 0;
    }

    .search-results [aria-selected="true"] .search-result,
    .search-result:hover,
    .search-result:focus {
      background: var(--panel2);
      color: var(--accent);
      outline: none;
    }

    .search-meta {
      color: var(--muted);
      font-size: 12px;
      flex: 0 0 auto;
    }

    .composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      background: rgba(10, 11, 16, 0.96);
      padding-bottom: var(--safeBottom);
    }

    .identify-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px 0;
    }

    .identify-button {
      flex: 1 1 0;
      min-height: 44px;
      border: 1px solid rgba(241,194,50,0.55);
      background: var(--panel2);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .identify-button:hover,
    .identify-button:focus {
      border-color: var(--accent);
      color: var(--accent);
      outline: 2px solid rgba(241,194,50,0.45);
      outline-offset: 1px;
    }

    .ask-hint {
      margin: 6px 16px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-self: flex-start;
      max-width: min(760px, 88vw);
    }

    .action-button {
      border: 1px solid rgba(241,194,50,0.45);
      background: var(--panel2);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .action-button:hover {
      border-color: rgba(241,194,50,0.85);
      color: var(--accent);
    }


    @media (max-width: 640px) {
      .message,
      .image-card,
      .action-row {
        max-width: 94vw;
      }

      .subtitle {
        display: none;
      }

      .send {
        width: 62px;
      }

      .identify-row {
        flex-direction: column;
      }

      .search-result {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="droid-icon">🤖</div>
      <div class="title-wrap">
        <div class="title">VF-CB</div>
        <div class="subtitle">Collector Companion Droid for vintage Star Wars figures and accessories</div>
      </div>
    </header>

    <div class="lookup" role="search">
      <label for="catalogSearch">Search figures and accessories</label>
      <input
        id="catalogSearch"
        type="search"
        autocomplete="off"
        enterkeyhint="search"
        placeholder="Search a figure or accessory"
        aria-label="Search figures and accessories"
        aria-autocomplete="list"
        aria-controls="catalogResults"
        aria-expanded="false"
      />
      <ul id="catalogResults" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </div>

    <main id="chat" class="chat"></main>

    <div id="status" class="status"></div>

    <div id="photoPreviewWrap" style="display:none;padding:10px;border-top:1px solid #333;background:#111">
      <img
        id="photoPreview"
        src=""
        style="max-width:180px;border-radius:12px;display:block;margin-bottom:10px"
      />

      <div style="display:flex;gap:10px">
        <button class="send" onclick="analysePhoto()">
          Analyse
        </button>

        <button class="send" onclick="cancelPhotoPreview()">
          Cancel
        </button>
      </div>
    </div>

    <footer class="composer">
      <div class="identify-row">
        <button type="button" id="identifyFigure" class="identify-button">Identify a figure</button>
        <button type="button" id="identifyAccessories" class="identify-button">Identify Accessories</button>
      </div>
      <p class="ask-hint">or ask me a question...</p>
      <div class="input-wrap">
        <input
          type="file"
          id="photoInput"
          accept="image/*"
          capture="environment"
          style="display:none"
        />

        <button type="button" class="send" id="photoButton" style="width:56px" aria-label="Upload a figure photo">
          📷
        </button>

        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="Ask about figures, variants, COOs, cloaks or accessories..."
          aria-label="Ask a question"
        ></textarea>

        <button type="button" class="send" id="sendButton">
          Send
        </button>
      </div>
    </footer>
  </div>

  <script type="module">
    import { previewSearch, openSearchResult, parseFollowUps, fallbackFollowUps, followTopicFor } from "./vfcb-chat-ui.js";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");

    const state = {
      history: [],
      flowState: null
    };

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatText(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }

    function setStatus(text) {
      statusEl.textContent = text || "";
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text) {
      const msg = document.createElement("div");
      msg.className = "message " + (role === "user" ? "user" : "bot");
      msg.innerHTML = formatText(text);
      chatEl.appendChild(msg);
      scrollToBottom();

      state.history.push({
        role: role === "user" ? "user" : "assistant",
        content: text
      });
    }

    function addImageCard(image) {
      if (!image || !image.url) return;

      const card = document.createElement("div");
      card.className = "image-card";

      if (image.title) {
        const title = document.createElement("div");
        title.className = "image-title";
        title.textContent = image.title;
        card.appendChild(title);
      }

      const img = document.createElement("img");
      img.src = image.url;
      img.alt = image.title || "VF-CB reference image";
      img.loading = "lazy";
      card.appendChild(img);

      if (image.caption) {
        const caption = document.createElement("div");
        caption.className = "image-caption";
        caption.innerHTML = formatText(image.caption);
        card.appendChild(caption);
      }

      chatEl.appendChild(card);
      scrollToBottom();
    }

    function addActionButtons(actions) {
      if (!Array.isArray(actions) || actions.length === 0) return;

      const row = document.createElement("div");
      row.className = "action-row";

      actions.forEach((action) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "action-button";
        button.textContent = action.label || action.value || "Select";
        button.setAttribute("aria-label", button.textContent);
        button.onclick = () => sendMessage(action.value || action.label || "");
        row.appendChild(button);
      });

      chatEl.appendChild(row);
      scrollToBottom();
    }

    async function askApi(message, imageDataUrl) {
      const payload = {
        message,
        history: state.history.slice(-30),
        flowState: state.flowState
      };

      if (imageDataUrl) {
        payload.image = imageDataUrl;
      }

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        throw new Error(data.error || "API error");
      }

      return data;
    }

    async function sendMessage(prefilledText) {
      const text = String(prefilledText || inputEl.value || "").trim();
      if (!text) return;

      addMessage("user", text);

      if (!prefilledText) {
        inputEl.value = "";
        autoSizeInput();
      }

      setStatus("VF-CB is checking the reference files...");

      try {
        const data = await askApi(text);

        state.flowState = data.flowState || null;

        if (Array.isArray(data.images)) {
          data.images.forEach(addImageCard);
        }

        const shown = presentReply(data, text);
        addMessage("assistant", shown.reply);

        if (shown.actions.length) addActionButtons(shown.actions);
      } catch (err) {
        console.error(err);
        addMessage("assistant", "Sorry, there was a problem getting an answer.");
      } finally {
        setStatus("");
      }
    }

    function presentReply(data, asked) {
      const parsed = parseFollowUps(data && data.reply);
      const reply = parsed.reply || "I could not find a useful answer from the reference files.";
      const guided = data && data.flowState && ["variant_identify", "accessory_identify", "data_flow"].includes(data.flowState.topic);
      let actions = Array.isArray(data && data.actions)
        ? data.actions.filter(action => action && (action.label || action.value))
        : [];
      if (!actions.length && !guided) {
        const followUps = parsed.followUps || fallbackFollowUps(followTopicFor(asked));
        actions = followUps.map(label => ({ label, value: label }));
      }
      return { reply, actions };
    }

    function startIdentifyFigure() {
      state.flowState = null;
      sendMessage("identify a figure");
    }

    function startIdentifyAccessories() {
      state.flowState = null;
      sendMessage("identify accessories");
    }

    let pendingPhoto = null;
    let catalogItems = [];
    let searchResults = [];
    let activeResult = -1;

    function openPhotoPicker() {
      document.getElementById("photoInput").click();
    }

    function loadCatalog() {
      fetch("data/catalog.json")
        .then((response) => response.json())
        .then((catalog) => {
          if (!Array.isArray(catalog.parts)) return catalog;
          return Promise.all(catalog.parts.map((name) => fetch(`data/${name}`).then((response) => response.json())))
            .then((parts) => ({
              figures: parts.flatMap((part) => part.figures || []),
              accessories: parts.flatMap((part) => part.accessories || [])
            }));
        })
        .then((catalog) => {
          catalogItems = [
            ...(catalog.figures || []).map((item) => ({ ...item, type: "figure" })),
            ...(catalog.accessories || []).map((item) => ({ ...item, type: "accessory" }))
          ];
        })
        .catch(() => {});
    }

    function renderSearchResults(query) {
      const list = document.getElementById("catalogResults");
      const box = document.getElementById("catalogSearch");
      const preview = previewSearch(query, catalogItems);
      searchResults = preview.results;
      activeResult = -1;
      list.innerHTML = "";
      if (!searchResults.length || !String(query || "").trim()) {
        list.hidden = true;
        box.setAttribute("aria-expanded", "false");
        box.removeAttribute("aria-activedescendant");
        return;
      }
      searchResults.forEach((item, index) => {
        const li = document.createElement("li");
        li.id = `catalog-result-${index}`;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", "false");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "search-result";
        const name = document.createElement("span");
        name.className = "search-name";
        name.textContent = item.name;
        const meta = document.createElement("span");
        meta.className = "search-meta";
        meta.textContent = `${item.type} · ${item.era || "era unknown"}`;
        button.append(name, meta);
        button.addEventListener("click", () => chooseSearchResult(item));
        li.appendChild(button);
        list.appendChild(li);
      });
      list.hidden = false;
      box.setAttribute("aria-expanded", "true");
    }

    function chooseSearchResult(item) {
      const opened = openSearchResult(item);
      const box = document.getElementById("catalogSearch");
      box.value = "";
      renderSearchResults("");
      if (opened.chatMessage && opened.typedQuerySent === false) sendMessage(opened.chatMessage);
    }

    function moveSearchResult(delta) {
      const options = [...document.querySelectorAll("#catalogResults [role='option']")];
      if (!options.length) return;
      activeResult = Math.max(0, Math.min(options.length - 1, activeResult + delta));
      options.forEach((option, index) => option.setAttribute("aria-selected", index === activeResult ? "true" : "false"));
      document.getElementById("catalogSearch").setAttribute("aria-activedescendant", options[activeResult].id);
      options[activeResult].scrollIntoView({ block: "nearest" });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadCatalog();
      document.getElementById("identifyFigure").addEventListener("click", startIdentifyFigure);
      document.getElementById("identifyAccessories").addEventListener("click", startIdentifyAccessories);
      document.getElementById("sendButton").addEventListener("click", () => sendMessage());
      document.getElementById("photoButton").addEventListener("click", openPhotoPicker);
      const searchBox = document.getElementById("catalogSearch");
      searchBox.addEventListener("input", () => renderSearchResults(searchBox.value));
      searchBox.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          moveSearchResult(1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveSearchResult(-1);
        } else if (event.key === "Enter") {
          event.preventDefault();
          if (activeResult >= 0 && searchResults[activeResult]) chooseSearchResult(searchResults[activeResult]);
        } else if (event.key === "Escape") {
          searchBox.value = "";
          renderSearchResults("");
        }
      });
      const input = document.getElementById("photoInput");

      input.addEventListener("change", (event) => {
        const file = event.target.files[0];

        if (!file) return;

        pendingPhoto = file;

        const reader = new FileReader();

        reader.onload = function(e) {
          document.getElementById("photoPreview").src = e.target.result;
          document.getElementById("photoPreviewWrap").style.display = "block";
        };

        reader.readAsDataURL(file);
      });
    });

    function cancelPhotoPreview() {
      pendingPhoto = null;

      document.getElementById("photoPreviewWrap").style.display = "none";
      document.getElementById("photoPreview").src = "";
      document.getElementById("photoInput").value = "";
    }

    async function analysePhoto() {
      if (!pendingPhoto) return;

      const photoToAnalyse = pendingPhoto;

      addMessage("user", "📷 Photo uploaded for analysis");
      setStatus("VF-CB is analysing the photo...");

      try {
        const imageDataUrl = await fileToDataUrl(photoToAnalyse);
        const data = await askApi("Analyse this uploaded figure photo.", imageDataUrl);

        state.flowState = data.flowState || null;

        if (Array.isArray(data.images)) {
          data.images.forEach(addImageCard);
        }

        const shown = presentReply(data, "identify a figure");
        addMessage("assistant", shown.reply || "I could not identify the figure from that image.");

        if (shown.actions.length) addActionButtons(shown.actions);
      } catch (err) {
        console.error(err);
        addMessage("assistant", "Sorry, there was a problem analysing the photo.");
      } finally {
        setStatus("");
        cancelPhotoPreview();
      }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read image file"));

        reader.readAsDataURL(file);
      });
    }

    function autoSizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
    }

    inputEl.addEventListener("input", autoSizeInput);

    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    addMessage(
      "assistant",
      "Hello, I'm VF-CB. Tap Identify a figure or Identify Accessories, or ask me a question."
    );
    addActionButtons(fallbackFollowUps("greeting").map((label) => ({ label, value: label })));

    window.sendMessage = sendMessage;
    window.openPhotoPicker = openPhotoPicker;
    window.analysePhoto = analysePhoto;
    window.cancelPhotoPreview = cancelPhotoPreview;
  </script>
</body>
</html>
